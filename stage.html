<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>City Hunt｜杜甫文化挑戰</title>

<style>

body{
margin:0;
font-family:system-ui,-apple-system,Arial,sans-serif;
background:#0b1220;
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:16px;
}

.card{
background:#121a2b;
border-radius:16px;
padding:20px;
width:100%;
max-width:460px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h1{font-size:22px;margin:0 0 10px}

.badge{
display:inline-block;
padding:6px 10px;
border-radius:999px;
background:rgba(255,255,255,.1);
font-size:12px;
margin-bottom:10px;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:700;
background:#60a5fa;
color:#000;
cursor:pointer;
}

.choice{
display:block;
width:100%;
text-align:left;
padding:12px;
margin-top:10px;
border-radius:10px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
color:white;
}

.choice.selected{
background:#60a5fa;
color:black;
}

.ok{color:#2dd4bf}
.bad{color:#fb7185}
.hidden{display:none}

.progress{
margin-top:18px;
padding:12px;
background:rgba(255,255,255,.05);
border-radius:10px;
}

.progress-label{
display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:6px;
}

.progress-bar-wrap{
height:12px;
background:rgba(255,255,255,.12);
border-radius:999px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#2dd4bf;
transition:width .4s;
}

#progressList{
margin-top:10px;
padding-left:18px;
}

#progressList li{
margin:6px 0;
}

</style>
</head>

<body>

<div class="card">

<span class="badge" id="stageName">載入中...</span>

<h1>City Hunt｜杜甫挑戰</h1>

<div class="progress">

<div class="progress-label">
<span>完成進度</span>
<span id="progressPercent">0%</span>
</div>

<div class="progress-bar-wrap">
<div class="progress-bar" id="progressBar"></div>
</div>

<ul id="progressList"></ul>

</div>

<p id="status">請先到達指定地點再開始定位。</p>

<button onclick="startGPS()">📡 開始定位</button>

<div id="quiz" class="hidden">

<p id="question"></p>

<div id="choices"></div>

<button onclick="checkAnswer()">提交答案</button>

<p id="feedback"></p>

</div>

</div>

<script>

const stages=[

{
name:"胡忠大廈",
lat:22.27454,
lng:114.17330,
radius:500,
question:"以下哪一首是杜甫的作品？",
choices:["靜夜思","春望","將進酒","相思"],
answer:1
},

{
name:"合和中心",
lat:22.2714,
lng:114.1696,
radius:500,
question:"以下哪一句出自杜甫《春望》？",
choices:[
"國破山河在，城春草木深",
"床前明月光，疑是地上霜",
"白日依山盡，黃河入海流",
"長風破浪會有時"
],
answer:0
},

{
name:"灣仔地鐵站 (A3出口)",
lat:22.27745,
lng:114.17335,
radius:500,
question:"杜甫被後世稱為什麼？",
choices:["詩仙","詩鬼","詩聖","詩佛"],
answer:2
},

{
name:"喜帖街",
lat:22.27621,
lng:114.17290,
radius:500,
question:"以下哪一首是杜甫的名作？",
choices:["登高","黃鶴樓","遊子吟","早發白帝城"],
answer:0
}

]

let current=0
let selected=null
let finished=new Array(stages.length).fill(false)

function renderStage(){

if(current>=stages.length) return

const s=stages[current]

selected=null

document.getElementById("stageName").innerText="📍 "+s.name

if(s.name.includes("灣仔")){
document.getElementById("status").innerText="請到灣仔地鐵站 A3 出口附近再定位"
}
else{
document.getElementById("status").innerText="到達 "+s.name+" 後按開始定位"
}

document.getElementById("question").innerText=s.question

const c=document.getElementById("choices")

c.innerHTML=""

s.choices.forEach((t,i)=>{

let btn=document.createElement("button")

btn.className="choice"

btn.innerText=String.fromCharCode(65+i)+". "+t

btn.onclick=()=>selectChoice(i)

c.appendChild(btn)

})

document.getElementById("quiz").classList.add("hidden")

updateProgress()

}

function selectChoice(i){

selected=i

document.querySelectorAll(".choice").forEach((b,index)=>{

b.classList.toggle("selected",index===i)

})

}

function startGPS(){

const s=stages[current]

navigator.geolocation.getCurrentPosition(

pos=>{

let d=distance(

pos.coords.latitude,

pos.coords.longitude,

s.lat,

s.lng

)

if(d<=s.radius){

document.getElementById("status").innerHTML="<span class='ok'>已到達 "+s.name+" 任務解鎖</span>"

document.getElementById("quiz").classList.remove("hidden")

}

else{

document.getElementById("status").innerHTML="距離目標約 "+Math.round(d)+" 米"

}

},

()=>{

document.getElementById("status").innerHTML="<span class='bad'>定位失敗，請允許 GPS</span>"

},

{
enableHighAccuracy:true,
timeout:12000,
maximumAge:10000
}

)

}

function checkAnswer(){

if(selected===null){

document.getElementById("feedback").innerHTML="<span class='bad'>請先選答案</span>"

return

}

if(selected===stages[current].answer){

finished[current]=true

document.getElementById("feedback").innerHTML="<span class='ok'>答對！</span>"

current++

if(current>=stages.length){

document.getElementById("stageName").innerText="🏆 全部完成"

document.getElementById("status").innerHTML="<span class='ok'>恭喜完成 City Hunt</span>"

document.getElementById("quiz").classList.add("hidden")

}

else{

setTimeout(renderStage,1200)

}

}

else{

document.getElementById("feedback").innerHTML="<span class='bad'>答案錯誤</span>"

}

updateProgress()

}

function updateProgress(){

const list=document.getElementById("progressList")

list.innerHTML=""

stages.forEach((s,i)=>{

let li=document.createElement("li")

if(finished[i]){

li.innerText="✅ "+s.name

}

else if(i===current){

li.innerText="📍 "+s.name+" (目前)"

}

else{

li.innerText="⏳ "+s.name

}

list.appendChild(li)

})

let done=finished.filter(x=>x).length

let percent=Math.round(done/stages.length*100)

document.getElementById("progressPercent").innerText=percent+"%"

document.getElementById("progressBar").style.width=percent+"%"

}

function distance(lat1,lng1,lat2,lng2){

const R=6371000

const dLat=(lat2-lat1)*Math.PI/180

const dLng=(lng2-lng1)*Math.PI/180

const a=

Math.sin(dLat/2)**2+

Math.cos(lat1*Math.PI/180)*

Math.cos(lat2*Math.PI/180)*

Math.sin(dLng/2)**2

return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

}

renderStage()

</script>

</body>
</html>
